name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Подготовка шаблонов экспорта
        run: |
          echo "HOME=$HOME GODOT_VERSION=$GODOT_VERSION"
          ls -la /root/.local/share/godot/export_templates/ || true
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ "$HOME" != "/root" ]; then
            cp -r /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          fi
          ls -la "$HOME/.local/share/godot/export_templates/"

      - name: Настройки редактора (Android SDK и Java)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JAVA="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which javac)")")")}"
          echo "SDK=$SDK JAVA=$JAVA"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA"
          EOF
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.3.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Отладочный ключ подписи
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Импорт ресурсов
        run: godot --headless --import || true

      - name: Сборка APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/IceLegends.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IceLegends-apk
          path: build/IceLegends.apk
